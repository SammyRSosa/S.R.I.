<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oscar Insight Search | SRI 2025</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e50914;
            --accent: #f59e0b;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --web-badge: #3b82f6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 3rem 0;
            text-align: center;
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
        }

        h1 {
            font-weight: 800;
            font-size: 3rem;
            margin: 0;
            background: linear-gradient(45deg, var(--accent), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .search-container {
            width: 90%;
            max-width: 850px;
            margin-top: -2rem;
            z-index: 10;
        }

        .search-box {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            padding: 0.5rem;
            border-radius: 50px;
            display: flex;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 1.2rem 2rem;
            font-size: 1.2rem;
            outline: none;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4);
        }

        .filters {
            display: flex;
            gap: 1.5rem;
            margin-top: 1.5rem;
            justify-content: center;
            font-size: 0.85rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .results {
            width: 90%;
            max-width: 850px;
            margin-top: 3rem;
            padding-bottom: 5rem;
        }

        /* --- RAG Card Styles --- */
        .rag-container {
            display: none;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 3rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .rag-container::before {
            content: "IA";
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 5rem;
            font-weight: 900;
            color: rgba(245, 158, 11, 0.05);
            pointer-events: none;
        }

        .rag-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
            color: var(--accent);
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .rag-answer {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #e2e8f0;
        }

        /* --- Movie Card Styles --- */
        .movie-card {
            background: var(--card);
            padding: 1.8rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s;
            animation: slideIn 0.5s ease-out forwards;
            opacity: 0;
        }

        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .movie-card:hover {
            transform: scale(1.01);
            border-color: rgba(229, 9, 20, 0.3);
            background: #232f42;
        }

        .movie-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .movie-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            display: block;
        }

        .movie-year {
            color: var(--text-dim);
            font-weight: 400;
            font-size: 1rem;
        }

        .badges {
            display: flex;
            gap: 0.5rem;
        }

        .badge {
            padding: 0.3rem 0.7rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-score { background: rgba(52, 211, 153, 0.1); color: #34d399; }
        .badge-web { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border: 1px solid #3b82f6; }

        .snippet {
            margin-top: 1.2rem;
            font-size: 1rem;
            color: var(--text-dim);
            line-height: 1.7;
        }

        .meta {
            margin-top: 1.2rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            gap: 1.5rem;
            font-size: 0.75rem;
            color: #64748b;
            font-family: monospace;
        }

        .loading {
            text-align: center;
            display: none;
            margin: 3rem 0;
            color: var(--accent);
            font-weight: 600;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(245, 158, 11, 0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .no-results {
            text-align: center;
            color: var(--text-dim);
            margin-top: 4rem;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Oscar Insight Search</h1>
        <p style="color: var(--text-dim); margin-top: 0.8rem; font-size: 1.1rem;">Motor Híbrido + RAG | Proyecto SRI 2025</p>
    </header>

    <div class="search-container">
        <form id="searchForm" class="search-box">
            <input type="text" id="query" placeholder="¿Qué películas de ciencia ficción han ganado mejor director?" autocomplete="off" required>
            <button type="submit" id="searchBtn">Analizar</button>
        </form>
        <div class="filters">
            <span>EBM + Vector + Web</span>
            <span>|</span>
            <span>v0.3.5 (Corte 2)</span>
        </div>
    </div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <span id="loadingText">Consultando base de conocimientos...</span>
    </div>

    <div class="results">
        <div id="ragContainer" class="rag-container">
            <div class="rag-header">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                Respuesta Inteligente
            </div>
            <div id="ragAnswer" class="rag-answer"></div>
        </div>
        
        <div id="resultsList"></div>
    </div>

    <script>
        const form = document.getElementById('searchForm');
        const resultsList = document.getElementById('resultsList');
        const ragContainer = document.getElementById('ragContainer');
        const ragAnswer = document.getElementById('ragAnswer');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');

        form.onsubmit = async (e) => {
            e.preventDefault();
            const query = document.getElementById('query').value;
            
            // Reset UI
            resultsList.innerHTML = '';
            ragContainer.style.display = 'none';
            loading.style.display = 'block';
            loadingText.innerText = "Buscando en el corpus híbrido...";

            try {
                // 1. Search Phase
                const searchRes = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, top_k: 5 })
                });
                const searchData = await searchRes.json();

                if (searchData.results.length === 0) {
                    loading.style.display = 'none';
                    resultsList.innerHTML = '<div class="no-results">No se encontró información ni en la DB ni en la Web.</div>';
                    return;
                }

                // Render Search Results
                renderResults(searchData.results);

                // 2. RAG Phase (Parallel or sequential)
                if (searchData.was_web_search) {
                    loadingText.innerText = "Extrayendo información de la web y generando respuesta...";
                } else {
                    loadingText.innerText = "Generando respuesta inteligente...";
                }

                const chatRes = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, results: searchData.results })
                });
                const chatData = await chatRes.json();

                loading.style.display = 'none';
                ragAnswer.innerText = chatData.answer;
                ragContainer.style.display = 'block';

            } catch (err) {
                loading.style.display = 'none';
                resultsList.innerHTML = `<div class="no-results">Error: ${err.message}</div>`;
            }
        };

        function renderResults(results) {
            resultsList.innerHTML = '';
            results.forEach((movie, index) => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.style.animationDelay = `${index * 0.1}s`;
                
                const webBadge = movie.is_web_result ? '<span class="badge badge-web">Fuente Web</span>' : '';
                
                card.innerHTML = `
                    <div class="movie-header">
                        <div>
                            <span class="movie-title">${movie.title}</span>
                            <span class="movie-year">${movie.year !== 'N/A' ? '(' + movie.year + ')' : ''}</span>
                        </div>
                        <div class="badges">
                            ${webBadge}
                            <span class="badge badge-score">Relevancia: ${(movie.score * 100).toFixed(0)}%</span>
                        </div>
                    </div>
                    <div style="font-size: 0.85rem; color: var(--accent); margin-top: 0.3rem;">
                        ${movie.director !== 'N/A' ? 'Director: ' + movie.director : ''}
                    </div>
                    <div class="snippet">${movie.snippet}</div>
                    <div style="margin-top: 0.5rem; display: flex; gap: 0.4rem; flex-wrap: wrap;">
                        ${movie.genres.map(g => `<span style="font-size: 0.7rem; background: rgba(255,255,255,0.05); padding: 0.1rem 0.4rem; border-radius: 4px;">${g}</span>`).join('')}
                    </div>
                    <div class="meta">
                        <span>EBM: ${movie.ebm_score.toFixed(3)}</span>
                        <span>VEC: ${movie.vector_score.toFixed(3)}</span>
                        <span>ID: ${movie.doc_id}</span>
                    </div>
                `;

                resultsList.appendChild(card);
            });
        }
    </script>
</body>
</html>
